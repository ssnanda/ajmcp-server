apiVersion: apps/v1
kind: Deployment
metadata:
  name: ajmcp-server
  labels:
    app: ajmcp-server
    app.kubernetes.io/version: "AJMCP_VERSION_PLACEHOLDER"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: ajmcp-server }
  template:
    metadata:
      labels:
        app: ajmcp-server
        app.kubernetes.io/version: "AJMCP_VERSION_PLACEHOLDER"
      annotations:
        ajmcp.io/deployed-at: "AJMCP_DEPLOYED_AT_PLACEHOLDER"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ajmcp
          image: AJMCP_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 3000, name: http } ]
          envFrom:
            - configMapRef: { name: ajmcp-config }
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: ajmcp-secrets, key: openai-api-key }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: ajmcp-secrets, key: anthropic-api-key }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: ajmcp-secrets, key: admin-token }
          volumeMounts:
            - { name: site-config, mountPath: /run/secrets/ajmcp, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: workspace, mountPath: /workspace, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: site-config
          secret:
            secretName: ajmcp-secrets
            items: [ { key: sites.json, path: sites.json } ]
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: workspace
          emptyDir: { sizeLimit: 256Mi }
