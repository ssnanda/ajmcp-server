apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ajmcp-server
  labels: { app: ajmcp-server }
spec:
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  # A build normally takes about a minute. If one hangs (for example a stalled npm download) it fails by itself after
  # 10 minutes instead of blocking every later build, because builds run one at a time.
  completionDeadlineSeconds: 600
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
      noCache: true
      buildArgs:
        - { name: CODEX_VERSION, value: "0.167.1" }
        - { name: CLAUDE_VERSION, value: "2.1.322" }
  output:
    to: { kind: ImageStreamTag, name: "ajmcp-server:latest" }
