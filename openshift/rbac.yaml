apiVersion: v1
kind: ServiceAccount
metadata:
  name: ajmcp-server
  labels: { app: ajmcp-server }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ajmcp-ollama-secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ajmcp-ollama-ssh"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ajmcp-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ajmcp-ollama-secret-manager
subjects:
  - kind: ServiceAccount
    name: ajmcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ajmcp-ollama-secret-manager
