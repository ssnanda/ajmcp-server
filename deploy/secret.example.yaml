# TEMPLATE ONLY. Do not commit a real Secret, token, or API key.
# For production use 'oc create secret generic' or External Secrets/Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: ajmcp-secrets
type: Opaque
stringData:
  openai-api-key: REPLACE_WITH_PROVIDER_KEY
  anthropic-api-key: REPLACE_WITH_PROVIDER_KEY
  nvidia-nim-api-key: REPLACE_WITH_PROVIDER_KEY
  admin-token: REPLACE_WITH_RANDOM_32_BYTE_PLUS_ADMIN_TOKEN
  sites.json: |
    {"sites":[{"id":"ncllcagents","token":"REPLACE_WITH_RANDOM_32_BYTE_PLUS_SITE_TOKEN","provider":"openai","model":"SET_SUPPORTED_OPENAI_MODEL_ID","systemPrompt":"Answer accurately from approved site information only. Escalate uncertain requests to staff."}]}
---
# Optional remote Ollama tunnel Secret. Prefer bin/3-oc-deploy.sh --sync-ollama-ssh instead of editing YAML.
apiVersion: v1
kind: Secret
metadata:
  name: ajmcp-ollama-ssh
type: Opaque
stringData:
  host: ollama.example.net
  user: ajmcp_tunnel
  port: "22"
  id_key: REPLACE_WITH_PRIVATE_KEY_WITH_TRAILING_NEWLINE
  known_hosts: REPLACE_WITH_VERIFIED_KNOWN_HOSTS_ENTRY
